; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
;   pip install -U platformio
;   platformio run -e node32s
;   platformio device list
;
;   platformio run -t monitor -e node32s --monitor-port COM3
;   platformio run -t upload -e node32s --upload-port COM3
;   platformio run -t uploadfs -e node32s --upload-port COM3
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[strict_ldf]
lib_ldf_mode = chain+

[platformio]
default_envs = node32s
src_dir = src
data_dir = data

[env]
;platform = espressif32@6.8.1
platform = espressif32@6.10.0
framework = arduino
; PanelLan hardware checks provide their own setup()/loop() and must stay out
; of normal classic ESP32 targets. PanelLan environments override this filter.
build_src_filter = +<*> -<PanelLanBringup.cpp> -<PanelLanLVGLBringup.cpp>


; The application lives in src/. Do not add the project root as a library,
; otherwise PlatformIO compiles every source file twice.
build_flags = -D USE_NIMBLE -DCORE_DEBUG_LEVEL=0 
    -Wno-maybe-uninitialized
    -Wno-unused-function
    -Wno-unused-but-set-variable
    -Wno-unused-variable
    -Wno-deprecated-declarations
    -Wno-unused-parameter
    -Wno-sign-compare
    -Wno-comment
    -Wno-write-strings
    
; https://github.com/espressif/esp-idf/tree/master/components/partition_table
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
;board_build.partitions = min_spiffs.csv
board_build.partitions = no_ota.csv
;board_build.partitions = std_littlefs.csv
board_build.filesystem = littlefs

build_unflags = -Werror=reorder

; this let you to download/backup the spiffs saved bank.
; uncomment following line and download https://github.com/maxgerhardt/pio-esp32-esp8266-filesystem-downloader/raw/main/download_fs.py
; extra_scripts = download_fs.py
extra_scripts = download_fs.py, build_presetuuids.py

lib_deps =
    adafruit/Adafruit BusIO
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit SH110X @ ^2.1.11
    adafruit/Adafruit GFX Library@1.11.11
    bblanchon/ArduinoJson@7.3.0
    t-vk/ESP32 BLE Keyboard@0.3.2
    h2zero/NimBLE-Arduino@1.4.3
    mickey9801/ButtonFever@1.0.0
    

[env:node32s]
board = node32s
upload_protocol = esptool
board_upload.require_upload_port = no
; upload_flags = --upload-port=/dev/cu.usbserial-0001
; COM1 or COM5
upload_port = /dev/cu.usbserial-0001   
upload_speed = 921600
monitor_port = COM[5]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file

[env:nodemcu-32s]
board = nodemcu-32s
; COM1 or COM5
upload_port = COM[13]
upload_speed = 921600
monitor_port = COM[5]
monitor_speed = 115200

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
; COM1 or COM5
upload_port = COM[15]
upload_speed = 921600
monitor_port = COM[5]
monitor_speed = 115200

[env:esp32dev]
board = esp32dev
upload_protocol = esptool
board_upload.require_upload_port = no
upload_port = COM6
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file

; Development/prototype build: no OLED, LEDs, or physical buttons required.
; Connect to the Spark over BLE and control it from a 115200-baud USB serial terminal.
[env:esp32dev-headless]
extends = env:esp32dev
build_flags = ${env.build_flags}
    -DHEADLESS_SERIAL_MODE

; PanelLan ZX2D80CE02S / SC05_X (WT32-S3-WROVER).
; This is the first hardware milestone: the built-in 240x320 TFT/touchscreen
; plus the serial Spark control console. External displays and switches are
; deliberately not configured here yet.
[env:panelan-sc05x]
board = esp32-s3-devkitc-1
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
; Conservative rate for the PanelLan USB CDC interface during hardware bring-up.
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHEADLESS_SERIAL_MODE
    -DPANELAN_SC05X_MODE
    -DNO_CLASSIC_BT
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.1.9
    https://github.com/smartpanle/PanelLan_esp32_arduino.git
; The original OLED, LED and footswitch sources initialize their legacy GPIOs
; before setup().  Those pins overlap the PanelLan LCD bus, so they must not be
; linked into the display-only controller profile.
build_src_filter = +<*> -<PanelLanBringup.cpp> -<PanelLanLVGLBringup.cpp> -<SparkButtonHandler.cpp> -<SparkDisplayControl.cpp> -<SparkLEDControl.cpp>

; Hardware-only checkpoint. Use this if the full firmware is not yet running:
; it proves USB serial, the built-in LCD, and touch without Spark code.
[env:panelan-display-bringup]
extends = env:panelan-sc05x
build_src_filter = +<PanelLanBringup.cpp>

; Isolated LVGL 9.x display/touch checkpoint.  This intentionally excludes the
; Spark stack so display ownership, flush lifetime, landscape rotation, and
; touch behavior can be measured independently before BLE coexistence work.
[env:panelan-lvgl-bringup]
extends = env:panelan-sc05x
build_src_filter = +<PanelLanLVGLBringup.cpp>
build_flags = ${env:panelan-sc05x.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    ${env:panelan-sc05x.lib_deps}
    lvgl/lvgl@9.3.0

; First combined checkpoint: LVGL owns the PanelLan screen while the normal
; direct Spark BLE controller runs in the Arduino loop. It is intentionally
; read-only: action/pending/confirmation work belongs behind ControllerActions.
[env:panelan-lvgl-controller]
extends = env:panelan-sc05x
build_flags = ${env:panelan-sc05x.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DPANELAN_LVGL_UI_MODE
    -DDISABLE_BACKGROUND_PRESET_CACHE
lib_deps =
    ${env:panelan-sc05x.lib_deps}
    lvgl/lvgl@9.3.0
